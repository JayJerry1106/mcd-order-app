# GitHub Pages 部署工作流（同时满足大赛「公开 GitHub 仓库」要求）
# 放置于仓库 .github/workflows/deploy-pages.yml，push 到 main 即自动部署
# 得到永久链接：https://<你的用户名>.github.io/<仓库名>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 无需构建：public/ 即完整静态站点（相对路径 + hash 路由，兼容子路径托管）
      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
