<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#DA291C" />
  <title>麦当劳点餐助手 · 麦乐点</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 90'%3E%3Cpath fill='%23FFC72C' d='M14 86C14 36 28 16 44 16c16 0 30 20 30 70H58c0-34-4-48-14-48S30 52 30 86z'/%3E%3Cpath fill='%23FFC72C' d='M46 86C46 36 60 16 76 16c16 0 30 20 30 70H90c0-34-4-48-14-48s-14 14-14 48z'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== 顶部导航 ===== -->
  <header class="app-header" id="app-header">
    <div class="header-inner">
      <a class="brand" href="#/menu">
        <svg class="arches" viewBox="0 0 120 90" aria-hidden="true">
          <path fill="currentColor" d="M14 86C14 36 28 16 44 16c16 0 30 20 30 70H58c0-34-4-48-14-48S30 52 30 86z"/>
          <path fill="currentColor" d="M46 86C46 36 60 16 76 16c16 0 30 20 30 70H90c0-34-4-48-14-48s-14 14-14 48z"/>
        </svg>
        <span class="brand-name">麦乐点<em>· 麦当劳点餐助手</em></span>
      </a>

      <button class="store-pill" id="store-pill" type="button" title="选择门店">
        <span class="store-pill-icon">📍</span>
        <span class="store-pill-text" id="store-pill-text">选择门店</span>
        <span class="store-pill-caret">▾</span>
      </button>

      <div class="header-actions">
        <span class="mode-badge live" id="mode-badge" title="数据来源">实时模式</span>
        <button class="icon-btn mic-btn" id="header-mic-btn" type="button" title="语音点餐" aria-label="语音点餐">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
            <path d="M12 18v4"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== 主区域 ===== -->
  <div class="app-body">
    <main class="app-main" id="view-root"><!-- 视图由 JS 渲染 --></main>

    <!-- 桌面端购物车侧栏 -->
    <aside class="cart-rail" id="cart-rail" aria-label="购物车"></aside>
  </div>

  <!-- ===== 移动端底部导航 ===== -->
  <nav class="bottom-nav" id="bottom-nav">
    <a href="#/menu" data-route="menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>点餐</span>
    </a>
    <a href="#/cart" data-route="cart">
      <span class="nav-cart-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/><path d="M3 4h2l2.6 12h10.8l2-8H6"/></svg>
        <em class="cart-badge" id="cart-badge" hidden>0</em>
      </span>
      <span>购物车</span>
    </a>
    <a href="#/orders" data-route="orders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12l1 6H5z"/><path d="M5 8v13h14V8"/><path d="M9 12h6"/></svg>
      <span>订单</span>
    </a>
    <button type="button" data-route="voice" id="nav-voice-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><path d="M12 18v4"></path></svg>
      <span>语音</span>
    </button>
  </nav>

  <!-- ===== 弹层 / 浮层根节点 ===== -->
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <!-- 语音交互浮层 -->
  <div class="voice-overlay" id="voice-overlay" hidden role="dialog" aria-modal="true" aria-label="语音点餐">
    <div class="voice-panel">
      <div class="voice-orb" id="voice-orb"><span>🎙️</span></div>
      <p class="voice-status" id="voice-status">正在聆听…</p>
      <p class="voice-transcript" id="voice-transcript"></p>
      <p class="voice-reply" id="voice-reply"></p>
      <div class="voice-suggest" id="voice-suggest"></div>
      <div class="voice-mic-fix" id="voice-mic-fix" hidden>
        <button class="btn btn-ghost" id="voice-retry-btn" type="button">重试</button>
        <a class="voice-external" id="voice-open-external" href="/" target="_blank" rel="noopener">在新标签页打开</a>
      </div>
      <div class="voice-actions">
        <button class="btn btn-ghost" id="voice-close-btn" type="button">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
